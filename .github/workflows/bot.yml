name: Nabz Bot

on:
  workflow_dispatch:
  schedule:
    - cron: "*/15 * * * *"

jobs:
  run-bot:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run Nabz once
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          GROUP_CHAT_ID: ${{ secrets.GROUP_CHAT_ID }}
          TOPIC_IRAN: ${{ secrets.TOPIC_IRAN }}
          TOPIC_MIDDLE_EAST: ${{ secrets.TOPIC_MIDDLE_EAST }}
          TOPIC_WORLD: ${{ secrets.TOPIC_WORLD }}
          POLL_MINUTES: "10"
          MAX_ITEMS_PER_FEED: "8"
          RUN_ONCE: "1"
        run: python bot.py
